<div class="login-page">

  <button class="theme-toggle" type="button" (click)="themeService.toggle()" [title]="themeService.isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
    <i class="bi" [ngClass]="themeService.isDarkMode ? 'bi-sun-fill' : 'bi-moon-fill'"></i>
  </button>

  <div class="login-container">
    <div class="login-box">

      <div class="login-header">
        <img src="/LogoOficialSEDH.png" alt="SEDH Logo" class="login-logo">
      </div>

      <h1 class="welcome-title">Bienvenido al Sistema de Permisos</h1>

      <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">

        <div class="form-group">
          <label for="username">Correo:</label>
          <input type="text" class="form-control" id="username" [(ngModel)]="username"
            name="username" required #usernameInput="ngModel"
            placeholder="nombre.apellido@sedh.gob.hn">
          <div *ngIf="usernameInput.invalid && usernameInput.touched" class="field-error">
            El correo es requerido
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <div class="password-input-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password"
              [(ngModel)]="password" name="password" required #passwordInput="ngModel"
              placeholder="Su contraseña...">
            <button type="button" class="password-toggle" (click)="togglePassword()">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
            </button>
          </div>
          <div *ngIf="passwordInput.invalid && passwordInput.touched" class="field-error">
            La contraseña es requerida
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-alert">
          <i class="bi bi-exclamation-circle-fill"></i> {{ errorMessage }}
        </div>

        <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || loading">
          <span *ngIf="loading" class="spinner"></span>
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>

      </form>

      <div class="forgot-password">
        <a [routerLink]="['/password-reset']">¿Es tu primer ingreso? Haz clic aquí</a>
      </div>

    </div>
  </div>

</div>
