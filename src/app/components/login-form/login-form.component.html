<div class="login-page">
  <div class="bg-flag"></div>
  <div class="bg-overlay"></div>
  <div class="bg-particles"></div>

  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <img src="/Recurso 8@4x-8.png" alt="SEDH Logo" class="login-logo">
      </div>

      <h1 class="welcome-title">Bienvenido al Sistema de Permisos</h1>

      <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">
        <div class="form-group mb-3">
          <label for="username">Correo:</label>
          <input type="text" class="form-control" id="username" [(ngModel)]="username" name="username" required #usernameInput="ngModel" placeholder="nombre.apellido@sedh.gob.hn">
          <div *ngIf="usernameInput.invalid && usernameInput.touched" class="text-danger">
            El correo es requerido
          </div>
        </div>

        <div class="form-group mb-3 password-field">
          <label for="password">Contraseña:</label>
          <div class="password-input-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password" [(ngModel)]="password" name="password" required #passwordInput="ngModel" placeholder="su contraseña de correo...">
            <button type="button" class="password-toggle" (click)="togglePassword()">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
            </button>
          </div>
          <div *ngIf="passwordInput.invalid && passwordInput.touched" class="text-danger">
            La contraseña es requerida
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn login-submit w-100" [disabled]="loginForm.invalid">Ingresar</button>
      </form>

      <div class="forgot-password mt-3">
        <a [routerLink]="['/password-reset']">Click aquí si es tu primer ingreso</a>
      </div>
    </div>
  </div>
</div>
