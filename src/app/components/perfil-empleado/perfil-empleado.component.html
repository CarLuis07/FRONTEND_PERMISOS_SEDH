<div class="container">
  <!-- Barra de búsqueda -->
  <div class="row mb-4 buscarEmpleado">
    <div class="col-md-8">
      <div class="input-group">
        <input type="text" 
               class="form-control" 
               [(ngModel)]="searchQuery" 
               placeholder="Ingrese correo institucional (ejemplo@sedh.gob.hn)"
               (keyup.enter)="buscarEmpleado()">
        <button class="btn btn-primary" 
                (click)="buscarEmpleado()"
                [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          <i *ngIf="!isLoading" class="bi bi-search"></i> Buscar
        </button>
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger mt-2">
        {{ errorMessage }}
      </div>
    </div>
  </div>

  <!-- Perfil del Empleado -->
  <div class="card" *ngIf="empleado">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h3>Perfil del Empleado</h3>
      <button class="btn btn-primary" 
              (click)="toggleEdicion()">
        {{ modoEdicion ? 'Guardar Cambios' : 'Editar Perfil' }}
      </button>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <div class="form-group mb-3">
            <label>Correo Institucional:</label>
            <input type="text" 
                   class="form-control" 
                   [(ngModel)]="empleado.emailInstitucional" 
                   [disabled]="true">
          </div>
          <div class="form-group mb-3">
            <label>Nombre Completo:</label>
            <input type="text" 
                   class="form-control" 
                   [(ngModel)]="empleado.nombre" 
                   [disabled]="!modoEdicion">
          </div>
          <div class="form-group mb-3">
            <label>Fecha de Ingreso:</label>
            <input type="date" 
                   class="form-control" 
                   [(ngModel)]="empleado.fechaIngreso" 
                   [disabled]="!modoEdicion">
          </div>
          <div class="form-group mb-3">
            <label>DNI:</label>
            <input type="text" 
                   class="form-control" 
                   [(ngModel)]="empleado.dni" 
                   [disabled]="!modoEdicion">
          </div>
          <div class="form-group mb-3">
            <label>Teléfono:</label>
            <input type="text" 
                   class="form-control" 
                   [(ngModel)]="empleado.telefono" 
                   [disabled]="!modoEdicion">
          </div>
          <div class="form-group mb-3">
            <label>Tipo de Contratación:</label>
            <input type="text" 
                   class="form-control" 
                   [(ngModel)]="empleado.tipoContrato" 
                   [disabled]="!modoEdicion">
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group mb-3">
            <label>Cargo:</label>
            <input type="text" 
                   class="form-control" 
                   [(ngModel)]="empleado.cargo" 
                   [disabled]="!modoEdicion">
          </div>
          <div class="form-group mb-3">
            <label>Dependencia:</label>
            <input type="text" 
                   class="form-control" 
                   [(ngModel)]="empleado.dependencia" 
                   [disabled]="!modoEdicion">
          </div>
          <div class="form-group mb-3">
            <label>Jefe Inmediato:</label>
            <input type="text" 
                   class="form-control" 
                   [(ngModel)]="empleado.jefeInmediato" 
                   [disabled]="!modoEdicion">
          </div>
          <div class="form-group mb-3">
            <label>Sexo:</label>
            <select class="form-control" 
                    [(ngModel)]="empleado.sexo" 
                    [disabled]="!modoEdicion">
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
            </select>
          </div>
          <div class="form-group mb-3">
            <label>Estado Civil:</label>
            <select class="form-control" 
                    [(ngModel)]="empleado.estadoCivil" 
                    [disabled]="!modoEdicion">
              <option value="SOLTERA/O">Soltero(a)</option>
              <option value="CASADA/O">Casado(a)</option>
              <option value="DIVORCIADA/O">Divorciado(a)</option>
              <option value="VIUDA/O">Viudo(a)</option>
            </select>
          </div>
          <div class="form-group mb-3">
            <label>Horas Disponibles:</label>
            <div class="input-group">
              <input type="text" 
                     class="form-control" 
                     [(ngModel)]="empleado.horasDisponibles" 
                     disabled>
              <button class="btn btn-secondary" 
                      (click)="abrirModalHoras()">
                <i class="bi bi-pencil"></i> Editar Horas
              </button>
            </div>
          </div>
          <div class="form-group mb-3">
            <label>Municipio:</label>
            <input type="text" 
                   class="form-control" 
                   [(ngModel)]="empleado.municipio" 
                   [disabled]="!modoEdicion">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal para editar horas disponibles -->
<div class="modal fade" id="modalEditarHoras" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true" [class.show]="mostrarModal" [style.display]="mostrarModal ? 'block' : 'none'" [class.modal-open]="mostrarModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header d-flex justify-content-between align-items-center">
        <h5 class="modal-title" id="modalLabel">Editar Horas Disponibles</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="cerrarModalHoras()"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="empleado" class="card">
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Empleado:</label>
              <input type="text" class="form-control" [value]="empleado.nombre" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Horas Disponibles Actuales:</label>
              <input type="text" class="form-control" [value]="empleado.horasDisponibles" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Nuevas Horas Disponibles:</label>
              <input type="text" class="form-control" [(ngModel)]="nuevasHoras" >
            </div>
            <div *ngIf="mensajeHoras" class="alert" [ngClass]="{'alert-success': !errorHoras, 'alert-danger': errorHoras}">
              {{ mensajeHoras }}
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cerrarModalHoras()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="actualizarHoras()" [disabled]="actualizandoHoras">
          <span *ngIf="actualizandoHoras" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          Guardar Cambios
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Overlay para el modal -->
<div class="modal-backdrop fade" [class.show]="mostrarModal" *ngIf="mostrarModal"></div>
