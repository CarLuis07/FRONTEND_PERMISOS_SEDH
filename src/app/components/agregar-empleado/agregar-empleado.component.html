<div class="form-container">
  <h1>Agregar Empleado</h1>
  <form (ngSubmit)="agregarEmpleado()" #empleadoForm="ngForm">
    <div class="form-row">
      <div class="form-group">
        <label for="email">Correo Institucional:</label>
        <input type="email" id="email" [(ngModel)]="empleado.email_institucional_empleado" name="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" [(ngModel)]="empleado.contrasena" name="contrasena" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="pri_nombre">Primer Nombre:</label>
        <input type="text" id="pri_nombre" [(ngModel)]="empleado.pri_nombre" name="pri_nombre" class="form-control" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="seg_nombre">Segundo Nombre:</label>
        <input type="text" id="seg_nombre" [(ngModel)]="empleado.seg_nombre" name="seg_nombre" class="form-control">
      </div>
      <div class="form-group">
        <label for="pri_apellido">Primer Apellido:</label>
        <input type="text" id="pri_apellido" [(ngModel)]="empleado.pri_apellido" name="pri_apellido" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="seg_apellido">Segundo Apellido:</label>
        <input type="text" id="seg_apellido" [(ngModel)]="empleado.seg_apellido" name="seg_apellido" class="form-control">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="fech_ingreso_laboral">Fecha de Ingreso:</label>
        <input type="date" id="fech_ingreso_laboral" [(ngModel)]="empleado.fech_ingreso_laboral" name="fech_ingreso_laboral" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="act_laboral">Activo Laboralmente:</label>
        <select id="act_laboral" [(ngModel)]="empleado.act_laboral" name="act_laboral" class="form-control" required>
          <option [value]="1">Sí</option>
          <option [value]="0">No</option>
        </select>
      </div>
      <div class="form-group">
        <label for="num_identidad">Número de Identidad:</label>
        <input type="text" id="num_identidad" [(ngModel)]="empleado.num_identidad" name="num_identidad" class="form-control" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="num_telefono">Número de Teléfono:</label>
        <input type="text" id="num_telefono" [(ngModel)]="empleado.num_telefono" name="num_telefono" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="id_tipo_contratacion">Tipo de Contratación:</label>
        <select id="id_tipo_contratacion" [(ngModel)]="empleado.id_tipo_contratacion" name="id_tipo_contratacion" class="form-control" required>
          <option *ngFor="let tipo of tiposContrataciones" [value]="tipo.id">{{ tipo.descripcion }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="id_dependencia">Dependencia:</label>
        <select id="id_dependencia" [(ngModel)]="empleado.id_dependencia" name="id_dependencia" class="form-control" (change)="onDependenciaChange()" required>
          <option *ngFor="let dependencia of dependencias" [value]="dependencia.id">{{ dependencia.descripcion }}</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="id_cargo">Cargo:</label>
        <select id="id_cargo" [(ngModel)]="empleado.id_cargo" name="id_cargo" class="form-control" required>
          <option *ngFor="let cargo of filteredCargos" [value]="cargo.id">{{ cargo.descripcion }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="id_sexo">Sexo:</label>
        <select id="id_sexo" [(ngModel)]="empleado.id_sexo" name="id_sexo" class="form-control" required>
          <option *ngFor="let sexo of sexos" [value]="sexo.id">{{ sexo.descripcion }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="id_estado_civil">Estado Civil:</label>
        <select id="id_estado_civil" [(ngModel)]="empleado.id_estado_civil" name="id_estado_civil" class="form-control" required>
          <option *ngFor="let estado of estadosCiviles" [value]="estado.id">{{ estado.descripcion }}</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="id_departamento_nacimiento">Departamento de Nacimiento:</label>
        <select id="id_departamento_nacimiento" [(ngModel)]="empleado.id_departamento_nacimiento" name="id_departamento_nacimiento" class="form-control" (change)="onDepartamentoChange()" required>
          <option *ngFor="let departamento of departamentos" [value]="departamento.id">{{ departamento.descripcion }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="id_municipio_nacimiento">Municipio de Nacimiento:</label>
        <select id="id_municipio_nacimiento" [(ngModel)]="empleado.id_municipio_nacimiento" name="id_municipio_nacimiento" class="form-control" required>
          <option *ngFor="let municipio of filteredMunicipios" [value]="municipio.id">{{ municipio.descripcion }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="id_rol">Rol:</label>
        <select id="id_rol" [(ngModel)]="empleado.id_rol" name="id_rol" class="form-control" required>
          <option *ngFor="let rol of roles" [value]="rol.id">{{ rol.descripcion }}</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="id_jefe_inmediato">Id Jefe Inmediato:</label>
        <input type="text" id="id_jefe_inmediato" [(ngModel)]="empleado.id_jefe_inmediato" name="id_jefe_inmediato" class="form-control" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="isFormValid()">Agregar Empleado</button>
  </form>
</div>
